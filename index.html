<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
</head>
<body>

    <h1>Error</h1>
    <p>Try again later.</p>

    <script>
        const webhookUrl = "YOUR_WEBHOOK_URL_HERE";

        // Read the name from the URL parameter (e.g., ?target=Alex)
        const urlParams = new URLSearchParams(window.location.search);
        const targetName = urlParams.get('target') || "Unknown Visitor";

        // Create the notification payload
        const payload = {
            embeds: [
                {
                    title: `🚨 ${targetName} opened the link!`,
                    description: "Link opened.",
                    color: 3447003 // Blue border
                }
            ]
        };

        // Send to Discord on every page load
        fetch(webhookUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        }).catch(error => console.error("Error:", error));
    </script>

</body>
</html>
