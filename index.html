<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Pinger</title>
    <style>
        body { 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; background-color: #2c2f33; font-family: sans-serif; 
        }
        button { 
            padding: 15px 30px; font-size: 20px; font-weight: bold;
            background-color: #5865F2; color: white; border: none; 
            border-radius: 8px; cursor: pointer; transition: 0.2s;
        }
        button:hover { background-color: #4752C4; }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <button id="pingBtn">Ping me on Discord!</button>

    <script>
        // Paste your webhook URL inside the quotes below
        const webhookUrl = "https://discord.com/api/webhooks/1537770986248601701/0HgBmgK-CmWmqivyfenWvtWMy4hypJTABeFny--_lF6CC4RPRtGr2kTKhnzU-bk0qzX0";

        document.getElementById("pingBtn").addEventListener("click", () => {
            
            // The message payload to send to Discord
            const payload = {
                content: "🚨 Ding! Someone just clicked the button on your website."
            };

            // Send the request to Discord
            fetch(webhookUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (response.ok) {
                    alert("Ping sent to Discord!");
                } else {
                    alert("Failed to send ping.");
                }
            })
            .catch(error => console.error("Error:", error));
        });
    </script>

</body>
</html>
