<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
</head>
<body>

    <h1>Welcome to my website!</h1>
    <p>A message was just sent to Discord in the background.</p>

    <script>
        // Paste your webhook URL inside the quotes below
        const webhookUrl = "https://discord.com/api/webhooks/1537770986248601701/0HgBmgK-CmWmqivyfenWvtWMy4hypJTABeFny--_lF6CC4RPRtGr2kTKhnzU-bk0qzX0";

        // The message payload to send to Discord
        const payload = {
            content: "👀 Alert: Someone just visited the website!"
        };

        // Send the request to Discord immediately when this script loads
        fetch(webhookUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        }).catch(error => console.error("Error:", error));
    </script>

</body>
</html>
